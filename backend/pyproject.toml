[project]
name = "backend"
version = "0.1.0"
authors = [
    { name = "CDR4733", email = "shsing2@naver.com" }
]
requires-python = ">=3.12"
dependencies = [
    "alembic>=1.20.1",
    "celery[redis]>=5.6.3",
    "cryptography>=50.0.2",
    "fastapi>=0.162.0",
    "greenlet>=3.5.6",
    "httpx>=0.28.1",
    "prometheus-client>=0.26.0",
    "psycopg[binary]>=3.3.6",
    "pydantic-settings>=2.16.1",
    "pydantic[email]>=2.14.1",
    "pyjwt>=2.15.1",
    "python-multipart>=0.0.32",
    "qdrant-client>=1.20.0",
    "sqlalchemy>=2.1.6",
    "uvicorn[standard]>=0.54.0",
]


[dependency-groups]
dev = [
    "ruff>=0.17.3",
]


[tool.ruff]
# 최근에는 모니터 가로 길이가 길어져 100, 120을 많이 선호함
line-length = 100

[tool.ruff.lint]
# 코드를 더 깔끔하게 강제하기 위한 린트 규칙 활성화 (선택 사항)
select = ["E", "F", "I", "UP", "B"]



